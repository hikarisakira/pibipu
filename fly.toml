# fly.toml for pibipu. No [http_service]: a Discord bot serves no HTTP, and an http_service
# with auto_stop_machines would let Fly Proxy stop the Machine for lack of traffic.
# https://fly.io/docs/reference/configuration/

app = 'pibipu'
primary_region = 'arn'

[build]

[mounts]
  source = 'pibipu_data'   # fly volumes create pibipu_data --region arn --size 1
  destination = '/data'    # state.json lives here

[[restart]]
  policy = 'always'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
