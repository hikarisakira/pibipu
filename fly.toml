# fly.toml app configuration file generated for pibipu on 2026-09-08T00:31:30+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pibipu'
primary_region = 'arn'

[build]
[[mounts]]
  source = 'pibipu_data'
  destination = '/data'

# This worker serves no HTTP. An HTTP service with auto-stop would stop notification polling.

[[restart]]
  policy = 'always'

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
