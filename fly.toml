# fly.toml app configuration file generated for pibipu on 2026-09-08T00:31:30+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pibipu'
primary_region = 'arn'

[build]
[[mounts]]
  source = 'pibipu_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[restart]]
  policy = 'always'

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
